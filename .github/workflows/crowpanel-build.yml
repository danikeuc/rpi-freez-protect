name: CrowPanel firmware

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/crowpanel-build.yml'
      - 'firmware/crowpanel/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/crowpanel-build.yml'
      - 'firmware/crowpanel/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/crowpanel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.2.0
      - name: Create compile-only placeholder credentials
        run: cp include/secrets.example.h include/secrets.h
      - name: Run native tests
        run: pio test -e native
      - name: Build CrowPanel firmware
        run: pio run -e crowpanel
