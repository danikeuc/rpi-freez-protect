name: repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Python tests
        run: python -m pytest -q
      - name: Python lint and types
        run: |
          python -m ruff check .
          python -m mypy src
      - name: Build package
        run: python -m build
      - name: Deployment asset syntax
        run: |
          python -m json.tool deployment/node-red/freeze-protect-paired-relay.json >/dev/null
          node --check deployment/node-red/preflight-no-legacy-gpio.js
          for file in \
            deployment/workstation-codex/bootstrap-freezeprotect-access.sh \
            deployment/workstation-codex/freeze-protect-commission \
            deployment/workstation-codex/freeze-protect-commission-ssh-dispatch; do
            sh -n "$file"
          done
      - name: Patch hygiene
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            EMPTY_TREE_SHA="$(git hash-object -t tree /dev/null)"
            git diff --check "$EMPTY_TREE_SHA" "$GITHUB_SHA"
          else
            git diff --check "$PUSH_BEFORE_SHA" "$GITHUB_SHA"
          fi
