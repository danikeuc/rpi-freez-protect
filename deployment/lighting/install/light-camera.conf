# Standalone camera-only HTTPS ingress. Existing shower server is untouched.
limit_req_zone $binary_remote_addr zone=independent_light_camera:1m rate=2r/s;
server {
    listen 192.168.114.192:8443 ssl;
    server_name 192.168.114.192;
    ssl_certificate /etc/independent-light/tls/server.crt;
    ssl_certificate_key /etc/independent-light/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/independent-light.error.log warn;
    client_max_body_size 4096;
    client_body_timeout 5s;
    send_timeout 6s;

    location = /api/v1/lights/events/unifi {
        if ($request_method != POST) { return 405; }
        limit_req zone=independent_light_camera burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8002;
        proxy_connect_timeout 2s;
        proxy_send_timeout 6s;
        proxy_read_timeout 6s;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
    location / { return 404; }
}
