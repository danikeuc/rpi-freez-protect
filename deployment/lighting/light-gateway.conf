# ADDITIVE TEMPLATE: include manually inside the existing port-8081 server.
# Not installed/enabled by any script. Existing nginx file remains untouched.
# Keep source gate DENY until exact trusted sender/client networks are reviewed.
# Controller and Node-RED remain loopback-only; protect remote transport with TLS.

location = /api/v1/lights/status {
    deny all;
    limit_except GET { deny all; }
    client_max_body_size 4k;
    client_body_timeout 2s;
    proxy_connect_timeout 1s;
    proxy_send_timeout 2s;
    proxy_read_timeout 2s;
    proxy_request_buffering on;
    proxy_pass_request_headers off;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Host 127.0.0.1;
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:8002/api/v1/lights/status;
}

