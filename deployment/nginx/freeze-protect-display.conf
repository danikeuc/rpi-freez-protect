server {
    listen 8081 default_server;
    server_name _;

    access_log /var/log/nginx/freeze-protect-display.access.log;
    error_log /var/log/nginx/freeze-protect-display.error.log warn;

    location = /api/v1/display/status {
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:8000;
        proxy_connect_timeout 2s;
        proxy_read_timeout 6s;
        proxy_send_timeout 6s;
        proxy_set_header Host $host;
    }

    location = /api/v1/display/actions/timed-shower {
        if ($request_method != POST) { return 405; }
        proxy_pass http://127.0.0.1:8000;
        proxy_connect_timeout 2s;
        proxy_read_timeout 6s;
        proxy_send_timeout 6s;
        proxy_set_header Host $host;
    }

    location = /api/v1/display/actions/drain {
        if ($request_method != POST) { return 405; }
        proxy_pass http://127.0.0.1:8000;
        proxy_connect_timeout 2s;
        proxy_read_timeout 6s;
        proxy_send_timeout 6s;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
