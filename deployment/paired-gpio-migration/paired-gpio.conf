[Unit]
ConditionPathExists=/etc/freeze-protect/paired-gpio-migration-approved

[Service]
EnvironmentFile=/etc/freeze-protect/paired-gpio.env
ExecStart=
ExecStart=/opt/freeze-protect-paired-gpio/venv-2.3.0/bin/python3 -I -B /opt/rpi-freez-protect/deployment/node-red/paired_gpio_daemon.py
DevicePolicy=closed
DeviceAllow=
DeviceAllow=/dev/gpiomem rw
DeviceAllow=/dev/gpiochip0 rw
Restart=no
