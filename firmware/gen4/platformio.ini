[platformio]
default_envs = gen4_28

[gen4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<*> -<bench.cpp> -<touch_probe.cpp>
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  https://github.com/4dsystems/GFX4dESP32/archive/2a36bda388985608a0d5ea64746f5d1b100d268b.zip
  greiman/SdFat@2.3.0
  bblanchon/ArduinoJson@7.2.1

[env:gen4_28]
extends = gen4
build_flags = ${gen4.build_flags} -D GEN4_TOUCH=0

[env:gen4_28_network_bench]
extends = gen4
build_flags = ${gen4.build_flags} -D GEN4_TOUCH=0 -D GEN4_NETWORK_BENCH=1

[env:gen4_28ct]
extends = gen4
build_flags = ${gen4.build_flags} -D GEN4_TOUCH=1

[env:gen4_28ct_test_hub]
extends = gen4
build_flags = ${gen4.build_flags} -D GEN4_TOUCH=1 -D GEN4_TEST_HUB=1

[env:gen4_28ct_offline]
extends = gen4
build_flags = ${gen4.build_flags} -D GEN4_TOUCH=1 -D GEN4_OFFLINE_BENCH=1

[env:gen4_28_bench]
extends = gen4
build_src_filter = -<*> +<bench.cpp>
build_flags = ${gen4.build_flags} -D GEN4_TOUCH=0

[env:gen4_28_touch_probe]
extends = gen4
build_src_filter = -<*> +<touch_probe.cpp>
build_flags = ${gen4.build_flags} -D GEN4_TOUCH=0

[env:native]
platform = native@1.2.1
test_build_src = true
build_src_filter = +<model.cpp> +<action.cpp>
build_flags = -std=c++11
lib_deps = bblanchon/ArduinoJson@7.2.1
